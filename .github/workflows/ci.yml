name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  coding-standards:
    name: CS, PHPStan, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build docker
        run: make up
      - name: Run CS check
        run: make cs-check
      - name: Run PHPStan
        run: make phpstan
      - name: Run PHP Parallel Lint
        run: make lint
